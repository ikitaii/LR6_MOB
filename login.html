<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wayfarer — Авторизация</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
    <div class="container header-inner">
        <a href="index.html"><img class="logo" src="LOGO.svg" alt="Wayfarer"></a>
        <nav class="nav">
            <a href="index.html#catalog">Каталог</a>
            <a href="index.html">Главная</a>
            <a href="profile.html">Профиль</a>
            <a class="favorite" href="#">♡</a>
        </nav>
    </div>
</header>

<main class="login-page">
    <form class="login-panel">
        <img class="login-logo" src="LOGO.svg" alt="Wayfarer">
        
        <p class="login-subtitle">Твои путешествия ближе</p>

        <h2 class="login-title">Добро пожаловать!</h2>
        <p>Авторизуйтесь для дальнейших действий</p>

        <input class="login-input" type="text" placeholder="Логин">
        <input class="login-input" type="password" placeholder="Пароль">

        <button class="login-button" type="submit">Войти</button>

        <p class="register-link">Нет аккаунта? <a href="#">Зарегистрироваться</a></p>
    </form>
</main>

</body>
</html>
